# 每次往默认分支（release）推送代码，或手动触发，
# 都会构建多架构镜像并推送到 Docker Hub：
#   mcdlol/sillytavernmod:latest
#   mcdlol/sillytavernmod:release-<short-sha>
#
# 首次使用前，请在本仓库的 GitHub 设置里添加两个 Secrets：
#   DOCKERHUB_USERNAME = mcdlol
#   DOCKERHUB_TOKEN    = 在 https://hub.docker.com/settings/security 生成的 Access Token
#                        （至少 Read/Write 权限；不要使用登录密码）

name: Publish to Docker Hub

on:
  push:
    branches:
      - release
  workflow_dispatch:
    inputs:
      tag:
        description: 'Extra tag to push (optional, e.g. v2026.05)'
        required: false
        default: ''

# 防止同分支并发构建把彼此的 buildx 缓存打乱
concurrency:
  group: dockerhub-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    # 仅在我们自己的仓库里跑，fork 出去的仓库默认跳过（避免别人的 PR 意外触发）
    if: github.repository == 'McDtot/SillyTavernMOD'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: mcdlol/sillytavernmod
          # latest       → 每次 release 分支构建都覆盖（给普通用户用）
          # release-sha7 → 每次构建生成的稳定回溯标签
          # <input.tag>  → 手动触发时可以再补一个标签（例如 "v2026.05"）
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/release' }}
            type=sha,prefix=release-,format=short,enable=${{ github.ref == 'refs/heads/release' }}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}
          labels: |
            org.opencontainers.image.title=SillyTavernMOD (STC-MOD)
            org.opencontainers.image.description=SillyTavern 1.18.0 fork with SillyTavernchat (STC-MOD) sidecar features.
            org.opencontainers.image.source=https://github.com/McDtot/SillyTavernMOD
            org.opencontainers.image.licenses=AGPL-3.0

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 缓存在 GitHub Actions 自带的 cache 里，降低下次构建时间
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Published images" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Users can update with:" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo 'docker pull mcdlol/sillytavernmod:latest' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
